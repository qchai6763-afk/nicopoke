[build]
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/group"
  to = "/.netlify/functions/group"
  status = 200

[[redirects]]
  from = "/api/group/*"
  to = "/.netlify/functions/group/:splat"
  status = 200

[[redirects]]
  from = "/style.css"
  to = "/css/style.css"
  status = 200

[[redirects]]
  from = "/store.js"
  to = "/js/store.js"
  status = 200

[[redirects]]
  from = "/data.js"
  to = "/js/data.js"
  status = 200

[[redirects]]
  from = "/main.js"
  to = "/js/main.js"
  status = 200
